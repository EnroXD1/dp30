services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: dp30
      POSTGRES_USER: dp30
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp30 -d dp30"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./server
    environment: &database
      DP30_DATABASE_URL: host=db dbname=dp30 user=dp30
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    command: ["python", "-c", "from dp30.db import migrate; migrate()"]
  api1: &api
    build: ./server
    environment: *database
    depends_on:
      migrate: { condition: service_completed_successfully }
  api2: *api
  https:
    image: caddy:2.10.2
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/tls:/certs:ro
    depends_on: [api1, api2]
  backup:
    image: postgres:18.1
    environment: *database
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - ./.local/backup:/backup
      - ./ops/daily-backup.sh:/daily-backup.sh:ro
    command: ["sh", "/daily-backup.sh"]
    restart: unless-stopped
volumes:
  pgdata:
