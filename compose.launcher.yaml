# Explicit overlay for the Windows launcher (Docker Compose >= 2.24.4).
services:
  migrate:
    image: dp30-launcher-server:local
  api1:
    image: dp30-launcher-server:local
  api2:
    image: dp30-launcher-server:local
  https:
    ports: !override
      - "${DP30_DOCKER_BIND:-127.0.0.1}:8443:8443"
    volumes: !override
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/docker-tls/server.pem:/certs/server.pem:ro
      - ./.local/docker-tls/server.key:/certs/server.key:ro
  backup:
    volumes:
      - ./.local/docker-backup:/backup
  tls:
    profiles: [tools]
    image: dp30-launcher-server:local
    user: "0:0"
    entrypoint: ["python", "/tmp/dp30-docker-tls.py"]
    volumes:
      - ./ops/docker-tls.py:/tmp/dp30-docker-tls.py:ro
      - ./.local/docker-tls:/certs
